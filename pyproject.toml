[project]
name = "colabfold"
version = "1.6.3"
description = "Making protein folding accessible to all. Predict proteins structures both in google colab and on your machine"
authors = [
    { name = "Milot Mirdita", email = "milot@skku.edu" },
    { name = "Sergey Ovchinnikov", email = "so@fas.harvard.edu" },
    { name = "Martin Steinegger", email = "martin.steinegger@snu.ac.kr" },
    { name = "Kostantin Schütze", email = "schuetze@in.tum.de" },
    { name = "Yoshitaka Moriwaki" },
    { name = "Lim Heo" },
]
readme = "README.md"
license = { text = "MIT, but separate licenses for the trained weights" }
requires-python = ">=3.10"
classifiers = [
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "matplotlib>=3.8.4,<4.0.0",
    "biopython<1.86",
    "numpy>=2.0.2,<3.0.0",
    "pandas>=2.2.2,<3.0.0",
    "requests>=2.26.0,<3.0.0",
    "tqdm>=4.62.2,<5.0.0",
    "appdirs>=1.4.4,<2.0.0",
    "importlib-metadata>=8.6.1,<9.0.0",
    "orjson>=3.11.4,<4.0.0",
]

[project.optional-dependencies]
alphafold = [
    # colabfold-legacy-kernels needs >=0.6.2 of jax, and check it still loads before raising the top.
    "alphafold-colabfold==2.3.20",
    "colabfold-binaries>=0.1.0,<0.2.0; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "colabfold-legacy-kernels>=0.2.0,<0.3.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax>=0.6.2,<0.12",
    "absl-py>=1.0.0,<2.0.0",
    "dm-tree>=0.1.9,<0.2.0",
    "dm-haiku>=0.0.17,<0.0.18",
    "py3Dmol>=2.0.1,<3.0.0",
]
alphafold-minus-jax = [
    "alphafold-colabfold==2.3.20",
    "colabfold-binaries>=0.1.0,<0.2.0; sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "colabfold-legacy-kernels>=0.2.0,<0.3.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "absl-py>=1.0.0,<2.0.0",
    "dm-tree>=0.1.9,<0.2.0",
    "dm-haiku>=0.0.17,<0.0.18",
    "py3Dmol>=2.0.1,<3.0.0",
]
openmm = [
    "openmm>=8.5,<9",
    "pdbfixer>=1.12.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/sokrypton/ColabFold"

[project.scripts]
colabfold_batch = "colabfold.batch:main"
colabfold_search = "colabfold.mmseqs.search:main"
colabfold_split_msas = "colabfold.mmseqs.split_msas:main"
colabfold_relax = "colabfold.relax:main"

[dependency-groups]
dev = [
    # The latest version conflicts with tensorflow over typing-extensions
    "black>=23.1.0,<24.0.0",
    "pytest>=6.2.5,<7.0.0",
]

[tool.pytest.ini_options]
addopts = "--tb=short"

[tool.black]
# Format only the new package, don't touch the existing stuff
include = '''
/(
  | colabfold
  | tests
)/
'''
# The colabfold.py exclude doesn't work, but the "fmt: off" inside of it does
extend-exclude = '''
/(
  | __pycache__
  | colabfold/colabfold.py
)/
'''

[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"
